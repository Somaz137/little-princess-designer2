# Netlify build configuration.
# The site is generated into dist/ from content/ + site/ on every push.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The admin is a single-page app; every path under it must serve its shell.
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Long-lived caching for fingerprint-free assets is unsafe, so keep HTML fresh
# and let the images cache hard.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
