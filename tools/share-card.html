<meta charset="utf-8">
<!--
  Source for site/assets/share-card.png — the picture WhatsApp, Facebook and
  Instagram show when someone shares a link to a page that has no photo of its
  own. 1200x630 is the size those services expect.

  It must stay a PNG or JPEG: WhatsApp and Facebook will not render a WebP link
  preview, which is why the site's own WebP images cannot be used here.

  To re-render after editing, from the repo root:

    npm run build
    cp tools/share-card.html dist/_card.html
    npm run serve                     # in another terminal
    # then, with any headless browser, screenshot at exactly 1200x630:
    chrome --headless --window-size=1200,630 \
           --screenshot=site/assets/share-card.png \
           http://localhost:8080/_card.html
    rm dist/_card.html

  It is served from dist/ rather than opened directly because the logo, photo
  and fonts below are referenced by absolute /assets/ paths.
  Keep the result under ~300 KB; WhatsApp skips previews for large images.
-->
<style>
  @font-face{font-family:"Caveat Brush";src:url("/assets/fonts/caveat-brush-400-latin.woff2") format("woff2");font-weight:400}
  @font-face{font-family:"Nunito";src:url("/assets/fonts/nunito-700-latin.woff2") format("woff2");font-weight:700}
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;background:#FFFCF8;
       display:flex;align-items:center;gap:56px;padding:0 72px;
       font-family:"Nunito",sans-serif}
  .txt{flex:1 1 auto}
  .logo{height:132px;width:auto;display:block;margin-bottom:30px}
  h1{font-family:"Caveat Brush",cursive;font-weight:400;font-size:72px;
     line-height:1.04;color:#5C1533;margin-bottom:22px}
  p{font-size:29px;line-height:1.4;color:#5A5C56;font-weight:700}
  .rule{width:132px;height:7px;border-radius:99px;background:#A43462;margin:30px 0 0}
  .shot{flex:0 0 366px;height:498px;border-radius:34px;overflow:hidden;
        border:5px solid #F3C9D9;background:#FDEEF4}
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
</style>
